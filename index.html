<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 在任何样式/脚本前同步应用主题，防止 FOUC。
      // 注意：与 src/stores/settings.ts 的初始化逻辑保持一致（同一 key、同一值格式）。
      try {
        var root = document.documentElement
        var dm = localStorage.getItem('darkMode')
        var dark = dm === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : dm === 'true'
        if (dark) root.classList.add('dark-mode')
        if (localStorage.getItem('performanceOptimization') === 'disabled') {
          root.classList.add('low-performance')
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konita的个人主页</title>
    <meta name="description" content="Konita的个人主页" />
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
