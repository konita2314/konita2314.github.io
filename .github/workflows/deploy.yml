name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 切换 Pages 源后首次部署失败时手动重跑兜底

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enable_jekyll: false
          # 把 Pages 发布源强制切回「GitHub Actions」。
          # 若发布源被改成「Deploy from a branch / main (root)」，Pages 会发布仓库源码
          # （index.html 引用 /src/main.ts，.ts 被当成 video/mp2t，整站白屏），
          # 并且每次 push 都会用源码覆盖 Actions 的构建产物。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
